<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>広域スムーズ湾曲ミラー</title><style>
body{margin:0;background:#111;color:#eee;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}canvas{width:100vw;height:100vh;display:block;touch-action:none}video{display:none}
.o{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:20;padding:20px}.c{width:min(92vw,560px);background:#1b1b1b;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px 16px}
.c h1{font-size:20px;margin:0 0 10px}.c p,.c li{font-size:14px;line-height:1.5;color:#ddd}.b{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{appearance:none;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.1);color:#fff;padding:10px 12px;font-size:14px}
.p{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:12px;z-index:10}
.r{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;margin:6px 0}input[type=range]{width:100%}.t{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;z-index:10}
.k{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 11px;font-size:12px;color:#fff}#s{white-space:pre-wrap;font-size:13px;color:#ffd8d8;margin-top:8px}
</style></head><body>
<video id='v' playsinline autoplay muted></video><canvas id='cv'></canvas>
<div class='t'><div class='k'>上下ドラッグ：歪み中心を移動</div><button class='k' id='flip' style='display:none'>前後カメラ切替</button></div>
<div class='p' id='panel' style='display:none'>
<div class='r'><label>中心の高さ</label><input id='cy' type='range' min='0.10' max='0.90' step='0.01' value='0.34'><span id='cyv'></span></div>
<div class='r'><label>影響範囲</label><input id='rg' type='range' min='0.08' max='0.65' step='0.01' value='0.28'><span id='rgv'></span></div>
<div class='r'><label>縦伸び強度</label><input id='st' type='range' min='0.00' max='3.20' step='0.01' value='1.75'><span id='stv'></span></div>
<div class='r'><label>滑らかさ</label><input id='sh' type='range' min='0.40' max='2.20' step='0.01' value='1.15'><span id='shv'></span></div>
<div class='r'><label>ガイド表示</label><input id='gd' type='range' min='0' max='1' step='1' value='1'><span id='gdv'></span></div>
</div>
<div class='o' id='ov'><div class='c'><h1>広域スムーズ湾曲ミラー</h1><p>横帯1本を中心に、画面全体へ滑らかに影響が広がるように縦方向へ湾曲させます。</p><ul><li>狭い帯だけを変形する方式ではなく、広い範囲へ減衰しながら影響します。</li><li>ピクセル取得はバイリニア補間です。</li><li>GitHub PagesなどのHTTPSで開いてください。</li></ul><div class='b'><button id='start'>カメラを起動</button><button id='retry'>再試行</button></div><div id='s'></div></div></div>
<script>
(()=>{const v=document.getElementById('v'),cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true}),of=document.createElement('canvas'),oc=of.getContext('2d',{willReadFrequently:true}),ov=document.getElementById('ov'),panel=document.getElementById('panel'),flip=document.getElementById('flip'),se=document.getElementById('s');
const ids=['cy','rg','st','sh','gd'],sl={},sv={};ids.forEach(id=>{sl[id]=document.getElementById(id);sv[id]=document.getElementById(id+'v')});
function uv(){sv.cy.textContent=(+sl.cy.value).toFixed(2);sv.rg.textContent=(+sl.rg.value).toFixed(2);sv.st.textContent=(+sl.st.value).toFixed(2);sv.sh.textContent=(+sl.sh.value).toFixed(2);sv.gd.textContent=(+sl.gd.value)?'ON':'OFF'}ids.forEach(id=>sl[id].addEventListener('input',uv));uv();
let fm='user',stream=null,drag=false,anim=false;
function msg(t){se.textContent=t}
async function cam(){msg('');if(!navigator.mediaDevices?.getUserMedia)throw Error('このブラウザはカメラAPIに未対応です。');if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')throw Error('HTTPSまたはlocalhostで開いてください。');if(stream)stream.getTracks().forEach(t=>t.stop());
const tries=[{video:{facingMode:{ideal:fm},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:fm},audio:false},{video:true,audio:false}];let e2=null;
for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);v.srcObject=stream;await v.play();panel.style.display='block';flip.style.display='inline-block';ov.style.display='none';if(!anim){anim=true;requestAnimationFrame(render)}return}catch(e){e2=e}}throw e2||Error('カメラ起動失敗')}
document.getElementById('start').onclick=()=>cam().catch(e=>msg('起動失敗: '+(e.message||e)));
document.getElementById('retry').onclick=()=>cam().catch(e=>msg('再試行失敗: '+(e.message||e)));
flip.onclick=()=>{fm=fm==='user'?'environment':'user';cam().catch(e=>{msg('切替失敗: '+(e.message||e));ov.style.display='flex'})};
function setY(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e,y=Math.min(.90,Math.max(.10,(p.clientY-r.top)/r.height));sl.cy.value=y.toFixed(2);uv()}
cv.addEventListener('mousedown',e=>{drag=true;setY(e)});window.addEventListener('mouseup',()=>drag=false);window.addEventListener('mousemove',e=>drag&&setY(e));
cv.addEventListener('touchstart',e=>{drag=true;setY(e)},{passive:true});cv.addEventListener('touchmove',e=>drag&&setY(e),{passive:true});cv.addEventListener('touchend',()=>drag=false);
function fit(){const dpr=Math.min(window.devicePixelRatio||1,1.35),w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
const clamp=(v,l,h)=>Math.max(l,Math.min(h,v));
function sample(src,sw,sh,x,y,out,idx){x=clamp(x,0,sw-1);y=clamp(y,0,sh-1);const x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(x0+1,sw-1),y1=Math.min(y0+1,sh-1),tx=x-x0,ty=y-y0,i00=(y0*sw+x0)*4,i10=(y0*sw+x1)*4,i01=(y1*sw+x0)*4,i11=(y1*sw+x1)*4;for(let c=0;c<4;c++)out[idx+c]=src[i00+c]*(1-tx)*(1-ty)+src[i10+c]*tx*(1-ty)+src[i01+c]*(1-tx)*ty+src[i11+c]*tx*ty}
function render(){fit();const w=cv.width,h=cv.height;if(!v.videoWidth){requestAnimationFrame(render);return}of.width=w;of.height=h;oc.save();oc.clearRect(0,0,w,h);const vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(w/vw,h/vh),dw=vw*sc,dh=vh*sc,dx=(w-dw)/2,dy=(h-dh)/2;if(fm==='user'){oc.translate(w,0);oc.scale(-1,1)}oc.drawImage(v,dx,dy,dw,dh);oc.restore();
const si=oc.getImageData(0,0,w,h),di=ctx.createImageData(w,h),src=si.data,dst=di.data,center=(+sl.cy.value)*h,sigma=Math.max(12,(+sl.rg.value)*h),str=+sl.st.value,shape=+sl.sh.value;
for(let y=0;y<h;y++){const d=y-center;let wt=Math.exp(-(d*d)/(2*sigma*sigma));wt=Math.pow(wt,shape);const sy=center+d/(1+str*wt);for(let x=0;x<w;x++)sample(src,w,h,x,sy,dst,(y*w+x)*4)}
ctx.putImageData(di,0,0);
if(+sl.gd.value){ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#fff';const gh=sigma*.9;ctx.fillRect(0,center-gh/2,w,gh);ctx.globalAlpha=.55;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,Math.floor(w/480));ctx.beginPath();ctx.moveTo(0,center);ctx.lineTo(w,center);ctx.stroke();ctx.restore()}
requestAnimationFrame(render)}
})();
</script></body></html>
