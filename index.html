<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>水平帯・縦伸びミラー</title>
<style>
body{margin:0;background:#111;color:#eee;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
canvas{width:100vw;height:100vh;display:block;touch-action:none}video{display:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:20;padding:20px}
.card{width:min(92vw,560px);background:#1b1b1b;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px 16px}
.card h1{font-size:20px;margin:0 0 10px}.card p,.card li{font-size:14px;line-height:1.5;color:#ddd}
.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
button{appearance:none;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.10);color:#fff;padding:10px 12px;font-size:14px}
.panel{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:12px;z-index:10}
.row{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;margin:6px 0}input[type=range]{width:100%}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;z-index:10}
.pill{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 11px;font-size:12px;color:#fff}
#status{white-space:pre-wrap;font-size:13px;color:#ffd8d8;margin-top:8px}code{background:#2a2a2a;padding:2px 4px;border-radius:6px}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video><canvas id="canvas"></canvas>
<div class="top"><div class="pill">上下ドラッグ：歪み帯の高さを移動</div><button class="pill" id="flipBtn" style="display:none;">前後カメラ切替</button></div>
<div class="panel" id="controls" style="display:none;">
  <div class="row"><label>帯の高さ</label><input id="bandY" type="range" min="0.10" max="0.90" step="0.01" value="0.38"><span id="bandYV"></span></div>
  <div class="row"><label>帯の太さ</label><input id="bandWidth" type="range" min="0.02" max="0.35" step="0.01" value="0.16"><span id="bandWidthV"></span></div>
  <div class="row"><label>縦伸び量</label><input id="stretch" type="range" min="0" max="2.5" step="0.01" value="1.35"><span id="stretchV"></span></div>
  <div class="row"><label>境界ぼかし</label><input id="softness" type="range" min="0.00" max="0.40" step="0.01" value="0.14"><span id="softnessV"></span></div>
  <div class="row"><label>帯の表示</label><input id="guide" type="range" min="0" max="1" step="1" value="1"><span id="guideV"></span></div>
</div>
<div class="overlay" id="overlay"><div class="card">
  <h1>水平帯・縦伸びミラー</h1>
  <p>画面上の横帯に入った部分だけを、縦方向に引き伸ばします。</p>
  <ul><li>iPhoneではHTTPSのGitHub Pages上で開いてください。</li><li>起動後、画面を上下にドラッグすると歪み帯の高さを変えられます。</li></ul>
  <div class="buttons"><button id="startBtn">カメラを起動</button><button id="retryBtn">再試行</button></div><div id="status"></div>
</div></div>
<script>
(()=>{const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),off=document.createElement('canvas'),offCtx=off.getContext('2d',{willReadFrequently:true}),overlay=document.getElementById('overlay'),statusEl=document.getElementById('status'),controls=document.getElementById('controls'),flipBtn=document.getElementById('flipBtn');
const sliders={bandY:document.getElementById('bandY'),bandWidth:document.getElementById('bandWidth'),stretch:document.getElementById('stretch'),softness:document.getElementById('softness'),guide:document.getElementById('guide')};
const vals={bandY:document.getElementById('bandYV'),bandWidth:document.getElementById('bandWidthV'),stretch:document.getElementById('stretchV'),softness:document.getElementById('softnessV'),guide:document.getElementById('guideV')};
function updateVals(){vals.bandY.textContent=Number(sliders.bandY.value).toFixed(2);vals.bandWidth.textContent=Number(sliders.bandWidth.value).toFixed(2);vals.stretch.textContent=Number(sliders.stretch.value).toFixed(2);vals.softness.textContent=Number(sliders.softness.value).toFixed(2);vals.guide.textContent=Number(sliders.guide.value)?'ON':'OFF'}Object.values(sliders).forEach(s=>s.addEventListener('input',updateVals));updateVals();
let facingMode='user',stream=null,dragging=false,animating=false;function setStatus(m){statusEl.textContent=m}
async function startCamera(){setStatus('');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('このブラウザはカメラAPIに未対応です。');if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1')throw new Error('HTTPSまたはlocalhostで開いてください。');if(stream)stream.getTracks().forEach(t=>t.stop());const tries=[{video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode},audio:false},{video:true,audio:false}];let lastErr=null;for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);video.srcObject=stream;await video.play();controls.style.display='block';flipBtn.style.display='inline-block';overlay.style.display='none';if(!animating){animating=true;requestAnimationFrame(distortFrame)}return}catch(e){lastErr=e}}throw lastErr||new Error('カメラ起動に失敗しました。')}
document.getElementById('startBtn').addEventListener('click',async()=>{try{await startCamera()}catch(e){setStatus('起動失敗: '+(e.message||e.name||String(e)))}});document.getElementById('retryBtn').addEventListener('click',async()=>{try{await startCamera()}catch(e){setStatus('再試行失敗: '+(e.message||e.name||String(e)))}});flipBtn.addEventListener('click',async()=>{facingMode=facingMode==='user'?'environment':'user';try{await startCamera()}catch(e){setStatus('カメラ切替失敗: '+(e.message||e.name||String(e)));overlay.style.display='flex'}});
function setBandFromEvent(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e,y=Math.min(.90,Math.max(.10,(p.clientY-r.top)/r.height));sliders.bandY.value=y.toFixed(2);updateVals()}canvas.addEventListener('mousedown',e=>{dragging=true;setBandFromEvent(e)});window.addEventListener('mouseup',()=>dragging=false);window.addEventListener('mousemove',e=>{if(dragging)setBandFromEvent(e)});canvas.addEventListener('touchstart',e=>{dragging=true;setBandFromEvent(e)},{passive:true});canvas.addEventListener('touchmove',e=>{if(dragging)setBandFromEvent(e)},{passive:true});canvas.addEventListener('touchend',()=>dragging=false);
function fitSize(){const dpr=Math.min(window.devicePixelRatio||1,2),w=Math.floor(innerWidth*dpr),h=Math.floor(innerHeight*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}}
function smoothstep(e0,e1,x){const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t)}
function sample(src,sw,sh,x,y,out,idx){x=Math.max(0,Math.min(sw-1,x));y=Math.max(0,Math.min(sh-1,y));const xi=x|0,yi=y|0,si=(yi*sw+xi)*4;out[idx]=src[si];out[idx+1]=src[si+1];out[idx+2]=src[si+2];out[idx+3]=255}
function distortFrame(){fitSize();const cw=canvas.width,ch=canvas.height;if(video.videoWidth===0){requestAnimationFrame(distortFrame);return}off.width=cw;off.height=ch;offCtx.save();offCtx.clearRect(0,0,cw,ch);const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(cw/vw,ch/vh),dw=vw*scale,dh=vh*scale,dx=(cw-dw)/2,dy=(ch-dh)/2;if(facingMode==='user'){offCtx.translate(cw,0);offCtx.scale(-1,1);offCtx.drawImage(video,dx,dy,dw,dh)}else{offCtx.drawImage(video,dx,dy,dw,dh)}offCtx.restore();
const srcImg=offCtx.getImageData(0,0,cw,ch),dstImg=ctx.createImageData(cw,ch),src=srcImg.data,dst=dstImg.data;const bandCenter=Number(sliders.bandY.value)*ch,bandHalf=Number(sliders.bandWidth.value)*ch,stretch=Number(sliders.stretch.value),softness=Number(sliders.softness.value),softPx=Math.max(1,bandHalf*softness);
for(let y=0;y<ch;y++){const dyb=y-bandCenter,absDy=Math.abs(dyb);let w=0;if(absDy<bandHalf){const edgeStart=Math.max(0,bandHalf-softPx);w=absDy<=edgeStart?1:1-smoothstep(edgeStart,bandHalf,absDy)}const scaleY=1/(1+stretch*w),sy=bandCenter+dyb*scaleY;for(let x=0;x<cw;x++){sample(src,cw,ch,x,sy,dst,(y*cw+x)*4)}}ctx.putImageData(dstImg,0,0);
if(Number(sliders.guide.value)){ctx.save();ctx.globalAlpha=.22;ctx.fillStyle='#fff';ctx.fillRect(0,bandCenter-bandHalf,cw,bandHalf*2);ctx.globalAlpha=.65;ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,Math.floor(cw/480));ctx.beginPath();ctx.moveTo(0,bandCenter);ctx.lineTo(cw,bandCenter);ctx.stroke();ctx.restore()}requestAnimationFrame(distortFrame)}})();
</script></body></html>
