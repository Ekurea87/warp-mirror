<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>リアルタイム湾曲ミラー v2</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#111; color:#eee; overflow:hidden; }
    #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#111; }
    canvas { width:100vw; height:100vh; object-fit:cover; touch-action:none; display:block; }
    video { display:none; }
    .overlay {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.78); z-index:20; padding:20px;
    }
    .card {
      width:min(92vw,560px); background:#1b1b1b; border:1px solid rgba(255,255,255,.14);
      border-radius:16px; padding:18px 16px;
    }
    .card h1 { font-size:20px; margin:0 0 10px; }
    .card p, .card li { font-size:14px; line-height:1.5; color:#ddd; }
    .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    button {
      appearance:none; border:1px solid rgba(255,255,255,.22); border-radius:10px;
      background:rgba(255,255,255,.10); color:#fff; padding:10px 12px; font-size:14px;
    }
    .panel {
      position:fixed; left:12px; right:12px; bottom:12px;
      background:rgba(0,0,0,.58); backdrop-filter: blur(10px);
      border:1px solid rgba(255,255,255,.14); border-radius:14px;
      padding:10px 12px; font-size:12px; z-index:10;
    }
    .row { display:grid; grid-template-columns: 86px 1fr 42px; gap:8px; align-items:center; margin:6px 0; }
    input[type=range] { width:100%; }
    .top {
      position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; justify-content:space-between;
      z-index:10;
    }
    .pill {
      background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.14);
      border-radius:999px; padding:8px 11px; font-size:12px; color:#fff;
    }
    #status { white-space:pre-wrap; font-size:13px; color:#ffd8d8; margin-top:8px; }
    code { background:#2a2a2a; padding:2px 4px; border-radius:6px; }
  </style>
</head>
<body>
  <div id="wrap">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
  </div>

  <div class="top">
    <div class="pill">画面をドラッグすると歪み中心を移動</div>
    <button class="pill" id="flipBtn" style="display:none;">前後カメラ切替</button>
  </div>

  <div class="panel" id="controls" style="display:none;">
    <div class="row"><label>顔の縦伸び</label><input id="stretch" type="range" min="0" max="1" step="0.01" value="0.62"><span id="stretchV"></span></div>
    <div class="row"><label>目の拡大</label><input id="eye" type="range" min="0" max="1" step="0.01" value="0.78"><span id="eyeV"></span></div>
    <div class="row"><label>輪郭の圧縮</label><input id="pinch" type="range" min="0" max="1" step="0.01" value="0.50"><span id="pinchV"></span></div>
    <div class="row"><label>歪み範囲</label><input id="radius" type="range" min="0.20" max="0.62" step="0.01" value="0.36"><span id="radiusV"></span></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1>リアルタイム湾曲ミラー</h1>
      <p>まずカメラ起動ボタンを押してください。</p>
      <ul>
        <li><b>iPhone/Safari</b> は <code>file://</code> で開いたHTMLではカメラが動かないことがあります。</li>
        <li>その場合は <b>HTTPSサイト</b> か <b>localhost</b> で開いてください。</li>
        <li>例：PCでフォルダ内で <code>python3 -m http.server 8000</code> → <code>http://localhost:8000</code></li>
      </ul>
      <div class="buttons">
        <button id="startBtn">カメラを起動</button>
        <button id="retryBtn">再試行</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d', { willReadFrequently: true });
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const controls = document.getElementById('controls');
  const flipBtn = document.getElementById('flipBtn');

  const sliders = {
    stretch: document.getElementById('stretch'),
    eye: document.getElementById('eye'),
    pinch: document.getElementById('pinch'),
    radius: document.getElementById('radius')
  };
  const vals = {
    stretch: document.getElementById('stretchV'),
    eye: document.getElementById('eyeV'),
    pinch: document.getElementById('pinchV'),
    radius: document.getElementById('radiusV')
  };
  function updateVals() {
    Object.keys(sliders).forEach(k => vals[k].textContent = Number(sliders[k].value).toFixed(2));
  }
  Object.values(sliders).forEach(s => s.addEventListener('input', updateVals));
  updateVals();

  let facingMode = 'user';
  let stream = null;
  let center = { x: 0.50, y: 0.45 };
  let dragging = false;
  let animating = false;

  function setStatus(msg) {
    statusEl.textContent = msg;
  }

  async function startCamera() {
    setStatus('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('このブラウザは getUserMedia に未対応です。Safari / Chrome の最新版で開いてください。');
    }

    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      throw new Error('このページは安全な接続(HTTPSまたはlocalhost)で開かれていません。iPhoneではこの状態だとカメラが起動しないことがあります。');
    }

    if (stream) stream.getTracks().forEach(t => t.stop());

    const tries = [
      { video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode }, audio: false },
      { video: true, audio: false }
    ];

    let lastErr = null;
    for (const c of tries) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        video.srcObject = stream;
        await video.play();
        controls.style.display = 'block';
        flipBtn.style.display = 'inline-block';
        overlay.style.display = 'none';
        if (!animating) {
          animating = true;
          requestAnimationFrame(distortFrame);
        }
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('カメラ起動に失敗しました。');
  }

  document.getElementById('startBtn').addEventListener('click', async () => {
    try {
      await startCamera();
    } catch (e) {
      setStatus('起動失敗: ' + (e.message || e.name || String(e)));
    }
  });

  document.getElementById('retryBtn').addEventListener('click', async () => {
    try {
      await startCamera();
    } catch (e) {
      setStatus('再試行失敗: ' + (e.message || e.name || String(e)));
    }
  });

  flipBtn.addEventListener('click', async () => {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    try {
      await startCamera();
    } catch (e) {
      setStatus('カメラ切替失敗: ' + (e.message || e.name || String(e)));
      overlay.style.display = 'flex';
    }
  });

  function setCenterFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    center.x = Math.min(1, Math.max(0, (p.clientX - r.left) / r.width));
    center.y = Math.min(1, Math.max(0, (p.clientY - r.top) / r.height));
  }
  canvas.addEventListener('mousedown', e => { dragging = true; setCenterFromEvent(e); });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => { if (dragging) setCenterFromEvent(e); });
  canvas.addEventListener('touchstart', e => { dragging = true; setCenterFromEvent(e); }, { passive:true });
  canvas.addEventListener('touchmove', e => { if (dragging) setCenterFromEvent(e); }, { passive:true });
  canvas.addEventListener('touchend', () => dragging = false);

  function fitSize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(innerWidth * dpr);
    const h = Math.floor(innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function smoothstep(edge0, edge1, x) {
    const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
    return t * t * (3 - 2 * t);
  }

  function sample(src, sw, sh, x, y, out, idx) {
    x = Math.max(0, Math.min(sw - 1, x));
    y = Math.max(0, Math.min(sh - 1, y));
    const xi = x | 0, yi = y | 0;
    const si = (yi * sw + xi) * 4;
    out[idx] = src[si];
    out[idx + 1] = src[si + 1];
    out[idx + 2] = src[si + 2];
    out[idx + 3] = 255;
  }

  function distortFrame() {
    fitSize();
    const cw = canvas.width, ch = canvas.height;

    if (video.videoWidth === 0) {
      requestAnimationFrame(distortFrame);
      return;
    }

    off.width = cw; off.height = ch;

    offCtx.save();
    offCtx.clearRect(0, 0, cw, ch);
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.max(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    if (facingMode === 'user') {
      offCtx.translate(cw, 0);
      offCtx.scale(-1, 1);
      offCtx.drawImage(video, dx, dy, dw, dh);
    } else {
      offCtx.drawImage(video, dx, dy, dw, dh);
    }
    offCtx.restore();

    const srcImg = offCtx.getImageData(0, 0, cw, ch);
    const dstImg = ctx.createImageData(cw, ch);
    const src = srcImg.data, dst = dstImg.data;

    const cx = center.x * cw, cy = center.y * ch;
    const baseR = Number(sliders.radius.value) * Math.min(cw, ch);
    const rx = baseR * 0.92;
    const ry = baseR * 1.55;
    const stretch = Number(sliders.stretch.value);
    const eye = Number(sliders.eye.value);
    const pinch = Number(sliders.pinch.value);

    const exOff = rx * 0.27;
    const eyOff = -ry * 0.18;
    const eyeR = baseR * 0.25;

    for (let y = 0; y < ch; y++) {
      for (let x = 0; x < cw; x++) {
        const i = (y * cw + x) * 4;
        let sx = x, sy = y;

        const nx = (x - cx) / rx;
        const ny = (y - cy) / ry;
        const d = Math.sqrt(nx * nx + ny * ny);

        if (d < 1.18) {
          const w = 1 - smoothstep(0.0, 1.18, d);
          sy = cy + (sy - cy) * (1 - 0.36 * stretch * w);
          const lowerBias = smoothstep(-0.15, 0.85, ny);
          sx = cx + (sx - cx) * (1 + 0.44 * pinch * w * lowerBias);
          const upperBias = 1 - smoothstep(-0.65, 0.25, ny);
          sx = cx + (sx - cx) * (1 - 0.18 * stretch * w * upperBias);
        }

        const eyes = [
          [cx - exOff, cy + eyOff],
          [cx + exOff, cy + eyOff]
        ];
        for (const [ecx, ecy] of eyes) {
          const dx2 = sx - ecx, dy2 = sy - ecy;
          const ed = Math.sqrt((dx2 * dx2) / (eyeR * eyeR) + (dy2 * dy2) / ((eyeR * 1.18) * (eyeR * 1.18)));
          if (ed < 1.15) {
            const ew = 1 - smoothstep(0.0, 1.15, ed);
            const zoom = 1 - 0.50 * eye * ew;
            sx = ecx + dx2 * zoom;
            sy = ecy + dy2 * zoom;
          }
        }

        sample(src, cw, ch, sx, sy, dst, i);
      }
    }

    ctx.putImageData(dstImg, 0, 0);
    requestAnimationFrame(distortFrame);
  }
})();
</script>
</body>
</html>
