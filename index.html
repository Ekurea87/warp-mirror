<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>広域スムーズ湾曲ミラー v8</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin:0; background:#111; color:#eee; overflow:hidden; }
    canvas { width:100vw; height:100vh; display:block; touch-action:none; }
    video { display:none; }
    .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.78); z-index:30; padding:20px; }
    .card { width:min(92vw,560px); background:#1b1b1b; border:1px solid rgba(255,255,255,.14); border-radius:16px; padding:18px 16px; }
    .card h1 { font-size:20px; margin:0 0 10px; }
    .card p, .card li { font-size:14px; line-height:1.5; color:#ddd; }
    .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    button { appearance:none; border:1px solid rgba(255,255,255,.22); border-radius:12px; background:rgba(255,255,255,.10); color:#fff; padding:10px 12px; font-size:14px; backdrop-filter: blur(8px); }
    .top { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; justify-content:space-between; z-index:10; transition: opacity .2s ease; }
    .pill { background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:8px 11px; font-size:12px; color:#fff; backdrop-filter: blur(8px); }
    .top-right { display:flex; gap:8px; }
    .panel { position:fixed; left:12px; right:12px; bottom:88px; background:rgba(0,0,0,.58); backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:10px 12px; font-size:12px; z-index:10; transition: opacity .2s ease, transform .2s ease; }
    .row { display:grid; grid-template-columns: 96px 1fr 44px; gap:8px; align-items:center; margin:6px 0; }
    input[type=range] { width:100%; }
    .capture-bar { position:fixed; left:12px; right:12px; bottom:12px; display:flex; gap:10px; justify-content:center; align-items:center; z-index:20; transition: opacity .2s ease; }
    .capture-btn { min-width:88px; background:rgba(0,0,0,.58); }
    .recording { background:rgba(160,0,0,.70); border-color:rgba(255,255,255,.25); }
    .status-pill { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:20; background:rgba(160,0,0,.70); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:8px 12px; font-size:12px; display:none; backdrop-filter: blur(8px); }
    .mini-bar { position:fixed; left:12px; right:12px; bottom:12px; z-index:25; display:none; justify-content:center; gap:10px; }
    body.minimal .top, body.minimal .panel { opacity:0; pointer-events:none; transform:translateY(8px); }
    body.minimal .capture-bar { display:none !important; }
    body.minimal .mini-bar { display:flex; }
    #status { white-space:pre-wrap; font-size:13px; color:#ffd8d8; margin-top:8px; }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div class="top">
    <div class="pill">上下ドラッグ：歪み中心を移動</div>
    <div class="top-right">
      <button class="pill" id="flipBtn" style="display:none;">前後カメラ切替</button>
      <button class="pill" id="hideUiTop" style="display:none;">UI非表示</button>
    </div>
  </div>

  <div class="status-pill" id="recStatus">● 録画中</div>

  <div class="panel" id="controls" style="display:none;">
    <div class="row"><label>中心の高さ</label><input id="centerY" type="range" min="0.10" max="0.90" step="0.01" value="0.34"><span id="centerYV"></span></div>
    <div class="row"><label>影響範囲</label><input id="range" type="range" min="0.08" max="0.65" step="0.01" value="0.28"><span id="rangeV"></span></div>
    <div class="row"><label>縦伸び強度</label><input id="strength" type="range" min="0.00" max="3.20" step="0.01" value="1.75"><span id="strengthV"></span></div>
    <div class="row"><label>滑らかさ</label><input id="shape" type="range" min="0.40" max="2.20" step="0.01" value="1.15"><span id="shapeV"></span></div>
    <div class="row"><label>ガイド表示</label><input id="guide" type="range" min="0" max="1" step="1" value="1"><span id="guideV"></span></div>
  </div>

  <div class="capture-bar" id="captureBar" style="display:none;">
    <button class="capture-btn" id="photoBtn">📷 写真保存</button>
    <button class="capture-btn" id="videoBtn">● 録画開始</button>
    <button class="capture-btn" id="hideUiBtn">UI非表示</button>
  </div>

  <div class="mini-bar" id="miniBar">
    <button class="capture-btn" id="showUiBtn">UI表示</button>
    <button class="capture-btn" id="photoMiniBtn">📷 写真</button>
    <button class="capture-btn" id="videoMiniBtn">● 録画</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <h1>広域スムーズ湾曲ミラー</h1>
      <p>横帯1本を中心に、画面全体へ滑らかに影響が広がるように縦方向へ湾曲させます。</p>
      <ul>
        <li>写真・動画はiPhoneの共有シートから写真アプリへ保存できます。</li><li>録画時はマイク音声も一緒に保存します。</li>
        <li>UI非表示で、撮影時のプレビューをすっきりさせられます。</li>
        <li>GitHub PagesなどのHTTPSで開いてください。</li>
      </ul>
      <div class="buttons">
        <button id="startBtn">カメラを起動</button>
        <button id="retryBtn">再試行</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

<script>
(() => {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d', { willReadFrequently: true });
  const overlay = document.getElementById('overlay');
  const statusEl = document.getElementById('status');
  const controls = document.getElementById('controls');
  const flipBtn = document.getElementById('flipBtn');
  const hideUiTop = document.getElementById('hideUiTop');
  const captureBar = document.getElementById('captureBar');
  const photoBtn = document.getElementById('photoBtn');
  const videoBtn = document.getElementById('videoBtn');
  const hideUiBtn = document.getElementById('hideUiBtn');
  const showUiBtn = document.getElementById('showUiBtn');
  const photoMiniBtn = document.getElementById('photoMiniBtn');
  const videoMiniBtn = document.getElementById('videoMiniBtn');
  const recStatus = document.getElementById('recStatus');

  const sliders = {
    centerY: document.getElementById('centerY'),
    range: document.getElementById('range'),
    strength: document.getElementById('strength'),
    shape: document.getElementById('shape'),
    guide: document.getElementById('guide')
  };
  const vals = {
    centerY: document.getElementById('centerYV'),
    range: document.getElementById('rangeV'),
    strength: document.getElementById('strengthV'),
    shape: document.getElementById('shapeV'),
    guide: document.getElementById('guideV')
  };
  function updateVals() {
    vals.centerY.textContent = Number(sliders.centerY.value).toFixed(2);
    vals.range.textContent = Number(sliders.range.value).toFixed(2);
    vals.strength.textContent = Number(sliders.strength.value).toFixed(2);
    vals.shape.textContent = Number(sliders.shape.value).toFixed(2);
    vals.guide.textContent = Number(sliders.guide.value) ? 'ON' : 'OFF';
  }
  Object.values(sliders).forEach(s => s.addEventListener('input', updateVals));
  updateVals();

  let facingMode = 'user';
  let stream = null;
  let dragging = false;
  let animating = false;
  let recorder = null;
  let recordedChunks = [];
  let recordingStream = null;
  let isRecording = false;

  function setStatus(msg) { statusEl.textContent = msg; }
  function setMinimalUI(on) { document.body.classList.toggle('minimal', on); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function chooseMimeType() {
    const candidates = ['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(type)) return type;
    }
    return '';
  }
  async function saveBlob(blob, filename) {
    // iPhone Safariでは、ブラウザから写真アプリへ直接保存はできない。
    // 代わりにWeb Share APIで共有シートを開き、「画像を保存」「ビデオを保存」を選べるようにする。
    try {
      const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
      if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch (e) {
      // 共有シートが使えない場合は下のダウンロードへフォールバック
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function timestamp() {
    const d = new Date();
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  }
  async function takePhoto() {
    try {
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('画像を生成できませんでした。');
      await saveBlob(blob, `warp_photo_${timestamp()}.png`);
    } catch (e) {
      alert('写真保存に失敗しました: ' + (e.message || e));
    }
  }
  async function startRecording() {
    if (!window.MediaRecorder) { alert('このブラウザは動画録画に未対応です。'); return; }
    try {
      recordedChunks = [];
      const canvasStream = canvas.captureStream(30);
      const audioTracks = stream ? stream.getAudioTracks() : [];
      recordingStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioTracks
      ]);
      if (audioTracks.length === 0) {
        alert('マイク音声が取得できていません。動画は無音で保存されます。音声付きにするには、ブラウザのマイク権限を許可してください。');
      }
      const mimeType = chooseMimeType();
      recorder = mimeType ? new MediaRecorder(recordingStream, { mimeType }) : new MediaRecorder(recordingStream);
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      recorder.onstop = () => {
        try {
          const type = recorder && recorder.mimeType ? recorder.mimeType : 'video/webm';
          const ext = type.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(recordedChunks, { type });
          saveBlob(blob, `warp_video_${timestamp()}.${ext}`);
        } catch (e) {
          alert('動画保存に失敗しました: ' + (e.message || e));
        }
        if (recordingStream) recordingStream.getTracks().forEach(t => t.stop());
        recordingStream = null;
        recorder = null;
        recordedChunks = [];
      };
      recorder.start(250);
      isRecording = true;
      recStatus.style.display = 'block';
      videoBtn.textContent = '■ 録画停止';
      videoMiniBtn.textContent = '■ 停止';
      videoBtn.classList.add('recording');
      videoMiniBtn.classList.add('recording');
    } catch (e) {
      alert('録画開始に失敗しました: ' + (e.message || e));
    }
  }
  function stopRecording() {
    if (recorder && isRecording) {
      isRecording = false;
      recStatus.style.display = 'none';
      videoBtn.textContent = '● 録画開始';
      videoMiniBtn.textContent = '● 録画';
      videoBtn.classList.remove('recording');
      videoMiniBtn.classList.remove('recording');
      recorder.stop();
    }
  }
  async function toggleRecording() { if (isRecording) stopRecording(); else await startRecording(); }

  async function startCamera() {
    setStatus('');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('このブラウザはカメラAPIに未対応です。');
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') throw new Error('HTTPSまたはlocalhostで開いてください。');
    if (stream) stream.getTracks().forEach(t => t.stop());
    const tries = [
      { video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } },
      { video: { facingMode }, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } },
      { video: true, audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } },
      { video: { facingMode: { ideal: facingMode }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: true, audio: false }
    ];
    let lastErr = null;
    for (const c of tries) {
      try {
        stream = await navigator.mediaDevices.getUserMedia(c);
        video.srcObject = stream;
        await video.play();
        controls.style.display = 'block';
        flipBtn.style.display = 'inline-block';
        hideUiTop.style.display = 'inline-block';
        captureBar.style.display = 'flex';
        overlay.style.display = 'none';
        if (!animating) { animating = true; requestAnimationFrame(render); }
        return;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('カメラ起動に失敗しました。');
  }

  document.getElementById('startBtn').addEventListener('click', async () => { try { await startCamera(); } catch (e) { setStatus('起動失敗: ' + (e.message || e.name || String(e))); } });
  document.getElementById('retryBtn').addEventListener('click', async () => { try { await startCamera(); } catch (e) { setStatus('再試行失敗: ' + (e.message || e.name || String(e))); } });
  flipBtn.addEventListener('click', async () => { facingMode = facingMode === 'user' ? 'environment' : 'user'; try { await startCamera(); } catch (e) { setStatus('カメラ切替失敗: ' + (e.message || e.name || String(e))); overlay.style.display = 'flex'; } });

  function setCenterFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    const y = Math.min(0.90, Math.max(0.10, (p.clientY - r.top) / r.height));
    sliders.centerY.value = y.toFixed(2);
    updateVals();
  }
  canvas.addEventListener('mousedown', e => { dragging = true; setCenterFromEvent(e); });
  window.addEventListener('mouseup', () => dragging = false);
  window.addEventListener('mousemove', e => { if (dragging) setCenterFromEvent(e); });
  canvas.addEventListener('touchstart', e => { dragging = true; setCenterFromEvent(e); }, { passive: true });
  canvas.addEventListener('touchmove', e => { if (dragging) setCenterFromEvent(e); }, { passive: true });
  canvas.addEventListener('touchend', () => dragging = false);

  function fitSize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.35);
    const w = Math.floor(innerWidth * dpr);
    const h = Math.floor(innerHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  function sampleBilinear(src, sw, sh, x, y, out, idx) {
    x = clamp(x, 0, sw - 1); y = clamp(y, 0, sh - 1);
    const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(x0 + 1, sw - 1), y1 = Math.min(y0 + 1, sh - 1);
    const tx = x - x0, ty = y - y0;
    const i00 = (y0 * sw + x0) * 4, i10 = (y0 * sw + x1) * 4, i01 = (y1 * sw + x0) * 4, i11 = (y1 * sw + x1) * 4;
    for (let c = 0; c < 4; c++) out[idx + c] = src[i00 + c] * (1 - tx) * (1 - ty) + src[i10 + c] * tx * (1 - ty) + src[i01 + c] * (1 - tx) * ty + src[i11 + c] * tx * ty;
  }

  function render() {
    fitSize();
    const cw = canvas.width, ch = canvas.height;
    if (video.videoWidth === 0) { requestAnimationFrame(render); return; }
    off.width = cw; off.height = ch;
    offCtx.save(); offCtx.clearRect(0, 0, cw, ch);
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.max(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    if (facingMode === 'user') { offCtx.translate(cw, 0); offCtx.scale(-1, 1); }
    offCtx.drawImage(video, dx, dy, dw, dh);
    offCtx.restore();
    const srcImg = offCtx.getImageData(0, 0, cw, ch), dstImg = ctx.createImageData(cw, ch);
    const src = srcImg.data, dst = dstImg.data;
    const center = Number(sliders.centerY.value) * ch;
    const sigma = Math.max(12, Number(sliders.range.value) * ch);
    const strength = Number(sliders.strength.value);
    const shape = Number(sliders.shape.value);
    for (let y = 0; y < ch; y++) {
      const dy = y - center;
      let weight = Math.exp(-(dy * dy) / (2 * sigma * sigma));
      weight = Math.pow(weight, shape);
      const sy = center + dy / (1 + strength * weight);
      for (let x = 0; x < cw; x++) sampleBilinear(src, cw, ch, x, sy, dst, (y * cw + x) * 4);
    }
    ctx.putImageData(dstImg, 0, 0);
    if (Number(sliders.guide.value)) {
      ctx.save();
      ctx.globalAlpha = 0.18; ctx.fillStyle = '#ffffff';
      const guideH = sigma * 0.9; ctx.fillRect(0, center - guideH / 2, cw, guideH);
      ctx.globalAlpha = 0.55; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, Math.floor(cw / 480));
      ctx.beginPath(); ctx.moveTo(0, center); ctx.lineTo(cw, center); ctx.stroke();
      ctx.restore();
    }
    requestAnimationFrame(render);
  }

  photoBtn.addEventListener('click', takePhoto);
  photoMiniBtn.addEventListener('click', takePhoto);
  videoBtn.addEventListener('click', toggleRecording);
  videoMiniBtn.addEventListener('click', toggleRecording);
  hideUiBtn.addEventListener('click', () => setMinimalUI(true));
  hideUiTop.addEventListener('click', () => setMinimalUI(true));
  showUiBtn.addEventListener('click', () => setMinimalUI(false));
})();
</script>
</body>
</html>
